spring:
  application:
    name: fhir-hub
  main:
    # No ASCII banner. The startup lines that matter are the port, the validator warm-up
    # time, and the Hikari pool; the banner only pushes them further down the log.
    banner-mode: "off"

server:
  # No `error:` block: Boot's error page comes from Spring MVC, which is not on the classpath —
  # this application registers the FHIR servlets directly and has no DispatcherServlet. Errors
  # inside /fhir/evs/ and /fhir/surveillance/ are rendered as OperationOutcome by HAPI; a request
  # to any other path gets the container's own 404.
  port: ${PORT:8080}

prescriptor:
  # The XML-RPC dispatch endpoint. Validated at startup; the application fails fast if absent.
  target-url: ${PRESCRIPTOR_TARGET_URL:https://alfa.prescriptor-test.nl/api/prescriptor/xmlrpc_dispatch.php}
  connect-timeout: 10s
  read-timeout: 30s

hub:
  # The Digitalis Hub's SOAP endpoint, which serves /fhir/surveillance/$check-medication. The
  # trailing slash is not decoration: the service is mounted at call/ and a request without it
  # is redirected.
  target-url: ${HUB_TARGET_URL:https://hub.digitalis.nl/call/}
  connect-timeout: 10s
  # Longer than Prescriptor's. One check runs the clinical-rules engine and then, per proposed
  # drug, a series of G-Standaard lookups for the dose bands; the rules half is measured in
  # milliseconds and the dose half is the one that can be slow.
  read-timeout: 60s

logging:
  level:
    nl.digitalis.fhirhub: ${LOG_LEVEL:INFO}
    # HAPI is chatty at startup about every registered operation.
    ca.uhn.fhir: WARN
  pattern:
    # Boot's default prefix is ~95 characters before the message; this one is ~46. Dropped:
    # the date and UTC offset (a container runtime stamps its own), the PID, the separator,
    # the application name, and the thread.
    #
    #   14:03:11.123 INFO  PrescriptorClient        : Session created for organization ...
    #
    # Tokens, so this can be edited without hunting the Logback manual:
    #   %d{HH:mm:ss.SSS}    time only; %d{yyyy-MM-dd HH:mm:ss.SSS} brings the date back
    #   %-5p                level, left-padded to 5
    #   %-24.-24logger{0}   logger name, padded and truncated to 24. {0} keeps only the
    #                       class, {39} gives n.d.f.p.PrescriptorClient. The `.-24`
    #                       truncates from the END: `.24` truncates from the front and
    #                       turns ExceptionHandlingInterceptor into ptionHandlingInterceptor.
    #                       Drop `.-24` to never truncate (ragged message column). 24 fits
    #                       every class here except PassThroughAuthenticationProvider.
    #   %m %n               message, newline
    #   %wex                exception; %wEx adds jar + version to every stack frame
    #   %clr(x){cyan}       colour; an empty {} means "colour by level"
    #
    # Add [%15.15t] after the level to follow interleaved concurrent requests (+17 chars).
    # Defining a logback.xml would silently override this — pick one place, not both.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%-5p){} %clr(%-24.-24logger{0}){cyan} %clr(:){faint} %m%n%wex"

    # The same layout for a log file, with two deliberate differences.
    #
    # The DATE IS BACK. The console pattern drops it because journald and a container runtime
    # both stamp their own; a file has nobody to do that, and a log of a medical-device
    # interface whose lines say only "08:33:09.766" cannot be read six months later.
    #
    # And NO %clr. The colour converter is driven by AnsiOutput, which is configured globally
    # rather than per appender, so under a TTY it would write ANSI escapes into the file — an
    # archived .gz full of \033[0;39m. It happens to be harmless under systemd, where stdout
    # is not a TTY and colour switches itself off, which is exactly what makes it the kind of
    # bug that only appears when someone runs the jar by hand to reproduce something.
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p %-24.-24logger{0} : %m%n%wex"

  # Where the file goes is deployment configuration and is deliberately NOT set here: unset,
  # Boot registers no file appender at all, so a developer running the jar gets the console
  # and nothing else. The server sets LOGGING_FILE_NAME in the systemd environment file —
  # see deploy/fhir-hub.env, and note that /var/log is read-only under the unit's
  # ProtectSystem=strict unless LogsDirectory= creates the path.
  #
  # Rotation is in-process, by Logback, rather than logrotate: one less moving part, and no
  # copytruncate window in which lines are lost. These are the live property names — the
  # logging.file.max-size family that reads more naturally is deprecated in favour of them.
  logback:
    rollingpolicy:
      # Rolls daily (the default file-name-pattern is ${LOG_FILE}.%d{yyyy-MM-dd}.%i.gz) and
      # again at this size within a day. Volume is startup-dominated - 16 lines and 1,920
      # bytes per boot, measured, and a served request logs nothing at all - so the size
      # trigger is the exception and the daily roll is what actually files the archives.
      max-file-size: 10MB
      # 90 days, not Boot's default 7. At the volume above this is a few hundred KB, and the
      # question a support call asks is "what did the interface answer that host last quarter".
      # Logback deletes only ON a rollover, which the daily roll guarantees.
      max-history: 90
      # A cap the default (0B) does not impose. This is the disk-full backstop, not the
      # retention policy: reaching it means something is logging in a loop.
      total-size-cap: 1GB

gstandaard:
  # Read-only reference lookup: resolves current medication (PRK/HPK) to the PRK+GPK pair
  # Prescriptor needs for medication surveillance. Consumed by GStandaardJdbcConfig, which
  # builds its own Hikari pool from these properties — deliberately not spring.datasource,
  # because this is a reference database and not the application's own store.
  datasource:
    url: ${GSTANDAARD_DB_URL:jdbc:mariadb://192.168.31.9:3306/gstandaard_views?serverTimezone=CET&useSSL=false}
    username: ${GSTANDAARD_DB_USER:adapter}
    password: ${GSTANDAARD_DB_PASSWORD:adapter}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
