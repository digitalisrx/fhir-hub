# The canonical matches the URLs the running service emits — see fhir/DigitalisExtensions.java,
# fhir/Systems.java and fhir/Profiles.java. Keep them in step; IgCanonicalsTest fails if they
# drift.
#
# spec.digitalis.nl rather than digitalis.nl: the artifacts get a host of their own, separate
# from the corporate site and from whatever eventually serves the API. The /fhir segment leaves
# room for the other contract Digitalis publishes, json-interface's OpenAPI.
id: nl.digitalis.fhirhub
canonical: http://spec.digitalis.nl/fhir
name: DigitalisFhirHub
title: "Digitalis fhir-hub Implementation Guide"
description: "FHIR R4 conformance artifacts for the Digitalis FHIR interface: two contracts on two FHIR bases — Prescriptor, the prescribing sessions of $formulary-session, $createrx-session and $session-result, and Surveillance, whose $check-medication request contract is published but not yet implemented."
status: draft
version: 0.3.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: Draft
publisher:
  name: Digitalis
  url: https://www.digitalis.nl
contact:
  - name: Digitalis
    telecom:
      - system: url
        value: https://www.digitalis.nl
jurisdiction: urn:iso:std:iso:3166#NL

parameters:
  # The publisher phones home with build statistics by default. A conformance build for a
  # closed set of integrators has no reason to.
  usage-stats-opt-out: true
  # Every profile here derives from base R4, so inheriting R4's invariants into each snapshot
  # table buries the handful of constraints this IG actually adds.
  show-inherited-invariants: false

# The pages under "The interface" are GENERATED from ../IMPLEMENTATION_GUIDE.md by
# scripts/build-pages.mjs — do not edit input/pagecontent for those, edit the guide. The list
# below is the contract between the two: the script fails if the guide's sections and these
# filenames stop matching, so a new section in the guide cannot silently go unpublished.
pages:
  index.md:
    title: Home
  conventions.md:
    title: Conventions
  authentication.md:
    title: Authentication
  prescriptor.md:
    title: Prescriptor
  flow.md:
    title: The Prescriptor flow
  metadata.md:
    title: GET /fhir/evs/metadata
  formulary-session.md:
    title: POST /fhir/evs/$formulary-session
  createrx-session.md:
    title: POST /fhir/evs/$createrx-session
  session-result.md:
    title: GET /fhir/evs/$session-result
  surveillance.md:
    title: Surveillance
  check-medication.md:
    title: POST /fhir/surveillance/$check-medication
  profiles.md:
    title: Profiles
  code-systems.md:
    title: Code systems
  lab-determinations.md:
    title: Lab determinations
  extensions.md:
    title: Extensions
  errors.md:
    title: Errors
  design-notes.md:
    title: Behaviour to design around
  migration.md:
    title: Moving from the JSON API
  limitations.md:
    title: Current limitations
  versioning.md:
    title: Versioning and change policy
  changelog.md:
    title: Changelog
  downloads.md:
    title: Downloads and validation

# One menu group per application, because they are two contracts on two FHIR bases and a reader
# is integrating with one of them, not with "the interface". Everything outside those two groups
# is shared by both. "(preview)" belongs in the menu rather than only on the page it labels: a
# reader has to be able to see that the response shape is not final before they click into it. The
# request contract is not a preview and has not changed since 0.2.0 — it is the answer that is
# young, and there is no profile for it yet.
menu:
  Home: index.html
  Getting started:
    Conventions: conventions.html
    Authentication: authentication.html
    Moving from the JSON API: migration.html
  Prescriptor:
    What it is: prescriptor.html
    The Prescriptor flow: flow.html
    GET /fhir/evs/metadata: metadata.html
    POST /fhir/evs/$formulary-session: formulary-session.html
    POST /fhir/evs/$createrx-session: createrx-session.html
    GET /fhir/evs/$session-result: session-result.html
  Surveillance (preview):
    What it is: surveillance.html
    POST /fhir/surveillance/$check-medication: check-medication.html
  Payloads:
    Profiles: profiles.html
    Code systems: code-systems.html
    Lab determinations: lab-determinations.html
    Extensions: extensions.html
    Errors: errors.html
  Guidance:
    Behaviour to design around: design-notes.html
    Current limitations: limitations.html
  Artifacts: artifacts.html
  Releases:
    Versioning and change policy: versioning.html
    Changelog: changelog.html
    Downloads and validation: downloads.html
